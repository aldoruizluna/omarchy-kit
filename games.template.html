<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro games · Omarchy Kit</title>
<link rel="stylesheet" href="portal.css">
<style>
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.big{font:700 2.6rem/1 system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 2px}
.big small{font-size:.42em;font-weight:600;color:var(--mut);margin-left:4px}
.meter{height:10px;border-radius:99px;background:var(--kbd);overflow:hidden;margin:8px 0 4px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--acc-fill,var(--acc));min-width:2px}
.meter.warn>i{background:var(--warn)}.meter.bad>i{background:var(--bad)}
.state{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.state svg{width:16px;height:16px}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sys .card{padding:12px 14px}
.sys h3{margin:0;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tier{font:600 .72rem var(--mono,ui-monospace,monospace);color:var(--mut);white-space:nowrap}
.sys .nums{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.sys .meter{height:6px;margin:6px 0 4px}
.pad{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:2em;height:1.9em;padding:0 8px;border-radius:99px;border:1px solid var(--line);
  border-bottom-width:3px;background:var(--kbd);font:700 .8rem var(--mono,ui-monospace,monospace);white-space:nowrap}
.btn+.btn{margin-left:4px}
.bios td,.bios th{padding:6px 8px;font-size:.88rem}
.bios code{font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--mut);margin:6px 0 10px}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0}
</style>

<h1 data-en="Retro games" data-es="Juegos retro"></h1>
<p class="lead" data-en="RetroArch tuned for this MacBook: every console from the NES to the GameCube, a PS4 controller, box art, and a library that stays within half of the free disk." data-es="RetroArch ajustado para esta MacBook: cada consola desde el NES hasta el GameCube, un control de PS4, carátulas y una biblioteca que no pasa de la mitad del disco libre."></p>
<div class="callout warn hidden" id="offline"></div>

<div class="strip">
  <div class="card">
    <div class="small mut" data-en="Controller" data-es="Control"></div>
    <div id="pad"></div>
  </div>
  <div class="card">
    <div class="small mut" data-en="Library" data-es="Biblioteca"></div>
    <div id="lib"></div>
  </div>
  <div class="card">
    <div class="small mut" data-en="Play" data-es="Jugar"></div>
    <p style="margin:8px 0 6px" data-en="Open <b>RetroArch</b> from the app launcher (<kbd>Super</kbd>+<kbd>Space</kbd>). Each console has its own playlist with box art; press <span class='btn'>✕</span> to start a game." data-es="Abre <b>RetroArch</b> desde el lanzador (<kbd>Super</kbd>+<kbd>Space</kbd>). Cada consola tiene su lista con carátulas; presiona <span class='btn'>✕</span> para empezar."></p>
    <p class="small mut" data-en="The PS button opens RetroArch's menu during a game." data-es="El botón PS abre el menú de RetroArch durante un juego."></p>
  </div>
</div>

<h2 data-en="PS4 controller shortcuts" data-es="Atajos del control de PS4"></h2>
<div class="card"><div class="pad" id="hotkeys"></div></div>
<p class="small mut" data-en="<b>GameCube</b> runs in standalone Dolphin (ES-DE opens it), not RetroArch: Share+Options quits back to ES-DE, Share+R1 / L1 save and load a state, PS pauses. On the keyboard: Escape quits, F1 / F2 save and load, arrows move, X is A and Return is Start."
   data-es="<b>GameCube</b> corre en Dolphin independiente (ES-DE lo abre), no en RetroArch: Share+Options sale a ES-DE, Share+R1 / L1 guardan y cargan estado, PS pausa. Con teclado: Escape sale, F1 / F2 guardan y cargan, las flechas mueven, X es A y Return es Start."></p>

<h2 data-en="Consoles" data-es="Consolas"></h2>
<div class="legend" id="legend"></div>
<div class="sys" id="sys"></div>

<h2 data-en="Adding your games" data-es="Agregar tus juegos"></h2>
<div class="card">
  <ol class="steps">
    <li data-en="Copy your own dumps into <code>~/Games/roms/&lt;console&gt;</code> (folders: nes, snes, n64, gb, gbc, gba, gc, mastersystem, megadrive, gamegear, sega32x, segacd, saturn, dreamcast, pcengine, pcenginecd, psx, arcade)." data-es="Copia tus propios respaldos en <code>~/Games/roms/&lt;consola&gt;</code> (carpetas: nes, snes, n64, gb, gbc, gba, gc, mastersystem, megadrive, gamegear, sega32x, segacd, saturn, dreamcast, pcengine, pcenginecd, psx, arcade)."></li>
    <li data-en="Name files the No-Intro / Redump way, like <code>Super Metroid (USA).sfc</code>, so box art matches. Keep discs as <b>CHD</b> and GameCube games as <b>RVZ</b>: about half the size of raw images." data-es="Nombra los archivos al estilo No-Intro / Redump, como <code>Super Metroid (USA).sfc</code>, para que coincidan las carátulas. Guarda los discos como <b>CHD</b> y los juegos de GameCube como <b>RVZ</b>: ocupan cerca de la mitad."></li>
    <li data-en="Press <b>Update library</b>: it rebuilds the playlists, fetches box art and re-checks the budget." data-es="Presiona <b>Actualizar biblioteca</b>: rehace las listas, descarga carátulas y revisa el presupuesto."></li>
  </ol>
  <div class="row" style="margin-top:10px"><button class="primary" id="scanBtn"></button><span class="small mut" id="scanMsg"></span></div>
  <p class="small mut" style="margin-top:10px" data-en="From a terminal: <code>~/labspace/omarchy-kit/games/kit-games scan</code>, then <code>kit-games art</code> and <code>kit-games budget</code>." data-es="Desde una terminal: <code>~/labspace/omarchy-kit/games/kit-games scan</code>, luego <code>kit-games art</code> y <code>kit-games budget</code>."></p>
</div>

<h2 data-en="Free games store" data-es="Tienda de juegos libres"></h2>
<p class="small mut" data-en="A store is a signed catalog that a publisher hosts: a list of free games (homebrew and freeware), each with its license, credits and checksums. The kit downloads the catalog, checks its signature against a publisher key <b>you</b> saved, and installs only what the catalog marks as free to download. Commercial games show up as guides (where to dump or buy your own copy), never as files." data-es="Una tienda es un catálogo firmado que aloja un publicador: una lista de juegos libres (homebrew y freeware), cada uno con su licencia, créditos y sumas de verificación. El kit descarga el catálogo, comprueba su firma con una llave del publicador que <b>tú</b> guardaste e instala solo lo que el catálogo marca como de descarga libre. Los juegos comerciales aparecen como guías (dónde copiar o comprar tu propia copia), nunca como archivos."></p>
<div class="card" id="store">
  <ol class="steps">
    <li data-en="Get the publisher's <b>public key</b> from the publisher and confirm it with them in person or on a channel you trust. Save it as <code>~/.config/omarchy-kit/store-publisher.pem</code>. The store trusts no other key and never accepts a key the first time it sees one." data-es="Pide al publicador su <b>llave pública</b> y confírmala con él en persona o por un canal de confianza. Guárdala como <code>~/.config/omarchy-kit/store-publisher.pem</code>. La tienda no confía en ninguna otra llave ni acepta una llave nueva la primera vez que la ve."></li>
    <li data-en="Fetch the catalog: <code>kit-games store refresh --from &lt;folder or https address&gt;</code>. To make the source permanent, add <code>[store]</code> and <code>source = &quot;https://…&quot;</code> to <code>~/.config/omarchy-kit/store.toml</code>. A catalog is accepted only if its checksum and signature match, its version is newer than yours, and nothing was removed from it without a tombstone." data-es="Descarga el catálogo: <code>kit-games store refresh --from &lt;carpeta o dirección https&gt;</code>. Para dejar la fuente fija, agrega <code>[store]</code> y <code>source = &quot;https://…&quot;</code> a <code>~/.config/omarchy-kit/store.toml</code>. Un catálogo se acepta solo si su suma y su firma coinciden, su versión es más nueva que la tuya y no se quitó nada sin una lápida (tombstone)."></li>
    <li data-en="Browse with <code>store list</code>, <code>store search</code> and <code>store info</code>, then install with <code>store get &lt;name&gt;</code>. Each install checks the library budget first, verifies the file's size and checksums (a bad file is deleted), shows its license and credit, and runs the same playlist and ES-DE steps as the rest of the kit." data-es="Explora con <code>store list</code>, <code>store search</code> y <code>store info</code> e instala con <code>store get &lt;nombre&gt;</code>. Cada instalación revisa primero el presupuesto de la biblioteca, verifica el tamaño y las sumas del archivo (un archivo malo se borra), muestra su licencia y crédito, y corre los mismos pasos de listas y ES-DE que el resto del kit."></li>
  </ol>
  <table class="bios" id="storeCmds" style="margin-top:8px">
    <tr><th data-en="Command (after <code>kit-games</code>)" data-es="Comando (después de <code>kit-games</code>)"></th><th data-en="What it does" data-es="Qué hace"></th></tr>
    <tr><td><code>store refresh [--from SOURCE] [--accept-drops]</code></td><td data-en="Fetch and verify the newest catalog. Refuses a bad signature, an older version, or entries dropped without a tombstone." data-es="Descarga y verifica el catálogo más reciente. Rechaza una firma mala, una versión anterior o entradas quitadas sin lápida."></td></tr>
    <tr><td><code>store list [--platform P] [--mode host|link|guide] [--installed]</code></td><td data-en="What the catalog offers (✓ = installed)." data-es="Lo que ofrece el catálogo (✓ = instalado)."></td></tr>
    <tr><td><code>store search TEXT</code></td><td data-en="Search titles, names and credits." data-es="Busca en títulos, nombres y créditos."></td></tr>
    <tr><td><code>store info NAME</code></td><td data-en="License, credits, checksums and source of one game." data-es="Licencia, créditos, sumas y origen de un juego."></td></tr>
    <tr><td><code>store get NAME…</code></td><td data-en="Download, verify and install free games; refuses commercial ones." data-es="Descarga, verifica e instala juegos libres; rechaza los comerciales."></td></tr>
    <tr><td><code>store remove NAME…</code></td><td data-en="Delete what the store installed. Your saves stay." data-es="Borra lo que instaló la tienda. Tus partidas se quedan."></td></tr>
    <tr><td><code>store sync</code></td><td data-en="Remove installed games the catalog has withdrawn." data-es="Quita los juegos instalados que el catálogo retiró."></td></tr>
    <tr><td><code>store health</code></td><td data-en="Key, catalog age and counts, installed games, budget." data-es="Llave, antigüedad y conteos del catálogo, juegos instalados, presupuesto."></td></tr>
  </table>
</div>
<p class="small mut" data-en="<b>Nothing is uploaded.</b> The store only downloads: the catalog from the source you set, and each game from the address inside the verified catalog. No account, no tracking. Each entry is <b>host</b> (the publisher serves the file), <b>link</b> (the file comes from its source's own site) or <b>guide</b> (a commercial game: instructions only). Your own dumps still go through the inbox below." data-es="<b>Nada se sube.</b> La tienda solo descarga: el catálogo desde la fuente que indiques y cada juego desde la dirección dentro del catálogo verificado. Sin cuenta ni rastreo. Cada entrada es <b>host</b> (el publicador sirve el archivo), <b>link</b> (el archivo viene del sitio de su origen) o <b>guide</b> (un juego comercial: solo instrucciones). Tus propias copias siguen pasando por la bandeja de abajo."></p>

<h2 data-en="Bring your own collection" data-es="Trae tu propia colección"></h2>
<p class="small mut" data-en="Your cartridges and discs become files with a dumper, then the inbox does the rest: it checks each dump against the No-Intro and Redump databases (a match means a clean dump), renames it to the official title so box art and Telesia match, compresses discs, and files it." data-es="Tus cartuchos y discos se vuelven archivos con un lector; luego la bandeja hace el resto: compara cada copia con las bases No-Intro y Redump (si coincide, la copia está limpia), le pone el título oficial para que coincidan carátulas y Telesia, comprime los discos y la archiva."></p>
<div class="card"><table class="bios" id="dumpers"></table></div>
<div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div id="inboxInfo"></div><button class="primary" id="ingestBtn"></button></div><pre class="small hidden" id="ingestOut" style="max-height:260px;overflow:auto"></pre></div>

<h2>Telesia</h2>
<div class="card"><div class="row" style="justify-content:space-between"><div id="telesiaInfo"></div><button id="exportBtn"></button></div>
<p class="small mut" style="margin-top:8px" data-en="Telesia keeps your completionist record; this machine keeps the games. The kit writes your library as RetroArch playlist entries with clean titles and the play time RetroArch logged, a format Telesia reads directly (its RetroArch profile). Upload it from Telesia's import panel, or with <code>kit-games export-telesia --upload</code> once you have a Telesia sign-in." data-es="Telesia guarda tu registro de completista; esta máquina guarda los juegos. El kit escribe tu biblioteca como entradas de lista de RetroArch con títulos limpios y el tiempo de juego que registró RetroArch, un formato que Telesia lee directamente (su perfil de RetroArch). Súbelo desde el panel de importación de Telesia, o con <code>kit-games export-telesia --upload</code> cuando tengas acceso a Telesia."></p></div>

<h2 data-en="BIOS files" data-es="Archivos BIOS"></h2>
<p class="small mut" data-en="Some consoles need the startup firmware of the real console, dumped from one you own, in <code>~/Games/bios</code>." data-es="Algunas consolas necesitan el firmware de arranque de la consola real, copiado de una que tengas, en <code>~/Games/bios</code>."></p>
<div class="card"><table class="bios" id="bios"></table></div>
</div>
<script>window.PORTAL=/*__PORTAL__*/{};window.TOKEN=/*__TOKEN__*/null;</script>
<script src="portal.js"></script><script src="portal-nav.js"></script>
<script>
const t = Portal.t, esc = Portal.esc;
let G = null;
const GB = 1e9, human = (b) => (b >= GB ? (b / GB).toFixed(1) + " GB" : b >= 1e6 ? Math.round(b / 1e6) + " MB" : Math.round(b / 1e3) + " KB");
const ICON = { ok: "M5 12l4 4 10-10", warn: "M12 4 2 20h20zM12 10v4M12 17h.01", off: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12h8" };
const state = (cls, label) => `<span class="state ${cls === "off" ? "mut" : cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[cls]}"/></svg>${esc(label)}</span>`;
const TIERS = { perfect: { en: "runs perfectly", es: "corre perfecto" }, great: { en: "runs great", es: "corre muy bien" }, good: { en: "most games full speed", es: "casi todo a velocidad completa" }, mixed: { en: "curated: varies by game", es: "selección: depende del juego" } };
const HOT = [
  [["PS"], { en: "RetroArch menu (pause, settings, quit to library)", es: "Menú de RetroArch (pausa, ajustes, volver a la biblioteca)" }],
  [["Share", "R1"], { en: "Save state", es: "Guardar estado" }],
  [["Share", "L1"], { en: "Load state", es: "Cargar estado" }],
  [["Share", "R2"], { en: "Hold to fast-forward", es: "Mantén para avanzar rápido" }],
  [["Share", "L2"], { en: "Hold to rewind (2D consoles)", es: "Mantén para rebobinar (consolas 2D)" }],
  [["Share", "Options"], { en: "Quit RetroArch (press twice)", es: "Salir de RetroArch (presiona dos veces)" }],
  [["✕"], { en: "Confirm in menus", es: "Aceptar en menús" }],
  [["○"], { en: "Back in menus", es: "Atrás en menús" }],
];
function draw() {
  document.getElementById("hotkeys").innerHTML = HOT.map(([b, d]) => `<div>${b.map((x) => `<span class="btn">${esc(x)}</span>`).join("")}</div><div>${esc(t(d))}</div>`).join("");
  document.getElementById("legend").innerHTML = Object.entries(TIERS).map(([k, v]) => `<span><b>${k}</b>: ${esc(t(v))}</span>`).join("");
  document.getElementById("scanBtn").textContent = t({ en: "Update library", es: "Actualizar biblioteca" });
  if (!G) return;
  const c = G.controller;
  document.getElementById("pad").innerHTML = c.name
    ? `<div class="big" style="font-size:1.4rem;margin-top:8px">${esc(c.name)}</div>${state("ok", t({ en: "Connected", es: "Conectado" }))}` +
      (c.battery ? `<div class="meter ${c.battery.pct < 25 ? "bad" : ""}"><i style="width:${c.battery.pct}%"></i></div><div class="small mut">${t({ en: "Battery", es: "Batería" })} ${c.battery.pct}% · ${esc(c.battery.status)}</div>` : "")
    : `<p style="margin:8px 0">${state("off", t({ en: "Not connected", es: "No conectado" }))}</p><p class="small">${t({ en: "Pair once: hold <span class='btn'>Share</span>+<span class='btn'>PS</span> until the light bar double-flashes, then pick “Wireless Controller” in the Bluetooth menu (<kbd>Super</kbd>+<kbd>Ctrl</kbd>+<kbd>B</kbd>). After that, just press PS.", es: "Emparéjalo una vez: mantén <span class='btn'>Share</span>+<span class='btn'>PS</span> hasta que la barra de luz parpadee dos veces y elige “Wireless Controller” en el menú Bluetooth (<kbd>Super</kbd>+<kbd>Ctrl</kbd>+<kbd>B</kbd>). Después, solo presiona PS." })}</p>`;
  const L = G.library;
  if (!L) { document.getElementById("lib").innerHTML = `<p class="mut">${t({ en: "Library tool not available.", es: "Herramienta de biblioteca no disponible." })}</p>`; return; }
  const pct = L.cap ? (100 * L.used) / L.cap : 0;
  document.getElementById("lib").innerHTML = `<div class="big">${L.games}<small>${t({ en: "games", es: "juegos" })}</small></div>
    <div class="meter ${pct > 100 ? "bad" : pct > 90 ? "warn" : ""}"><i style="width:${Math.min(100, pct)}%"></i></div>
    <div class="small mut">${human(L.used)} ${t({ en: "of", es: "de" })} ${human(L.cap)} ${t({ en: "budget", es: "de presupuesto" })} (${pct < 0.1 ? "<0.1" : pct.toFixed(1)}%) · ${t({ en: "plan", es: "plan" })} ${human(L.plan)}</div>
    <div class="small mut">${t({ en: "Box art", es: "Carátulas" })}: ${human(L.art)}</div>`;
  document.getElementById("sys").innerHTML = L.rows.map((r) => {
    const p = r.alloc ? (100 * r.used) / r.alloc : 0;
    return `<div class="card"><h3>${esc(r.name)}<span class="tier">${esc(r.tier)}</span></h3>
      <div class="meter ${p > 115 ? "warn" : ""}"><i style="width:${Math.min(100, p)}%"></i></div>
      <div class="nums"><span>${r.games} / ${r.target} ${t({ en: "games", es: "juegos" })}</span><span>${human(r.used)} / ${human(r.alloc)}</span></div></div>`;
  }).join("");
  const NEED = { required: { en: "required", es: "obligatorio" }, recommended: { en: "recommended", es: "recomendado" }, optional: { en: "optional", es: "opcional" } };
  const B = [...L.bios].sort((a, b) => a.present - b.present || a.optional - b.optional);
  document.getElementById("bios").innerHTML = `<tr><th></th><th>${t({ en: "Console", es: "Consola" })}</th><th>${t({ en: "File in ~/Games/bios", es: "Archivo en ~/Games/bios" })}</th><th>${t({ en: "Needed?", es: "¿Necesario?" })}</th></tr>` +
    B.map((b) => `<tr><td>${b.present ? state("ok", "") : b.optional ? state("off", "") : state("warn", "")}</td><td>${esc(b.system)}</td><td>${(b.present ? [b.file] : b.alternatives).map((f) => `<code>${esc(f)}</code>`).join(` <span class="mut small">${t({ en: "or", es: "o" })}</span> `)}<div class="small mut">${esc(b.desc)}</div></td><td>${b.need === "required" ? `<b>${t(NEED.required)}</b>` : t(NEED[b.need])}</td></tr>`).join("");
}
const DUMP = [
  [{ en: "Game Boy, Game Boy Color, GBA", es: "Game Boy, Game Boy Color, GBA" }, "GB Operator (Epilogue) · Open Source Cartridge Reader", { en: "USB; saves can be backed up too", es: "USB; también respalda partidas" }],
  [{ en: "NES, SNES, N64, Mega Drive, Master System, Game Gear, PC Engine, 32X", es: "NES, SNES, N64, Mega Drive, Master System, Game Gear, PC Engine, 32X" }, "Open Source Cartridge Reader (sanni/cartreader)", { en: "One open-hardware reader with adapters per console", es: "Un lector de hardware abierto con adaptadores por consola" }],
  [{ en: "PlayStation, Saturn, Sega CD, PC Engine CD", es: "PlayStation, Saturn, Sega CD, PC Engine CD" }, "USB CD/DVD drive + redumper", { en: "redumper is the Redump project's dumper; this MacBook has no optical drive", es: "redumper es el lector del proyecto Redump; esta MacBook no tiene unidad óptica" }],
  [{ en: "Dreamcast", es: "Dreamcast" }, { en: "A Dreamcast with an SD card adapter (DreamShell)", es: "Un Dreamcast con adaptador de SD (DreamShell)" }, { en: "PC drives can't read GD-ROMs", es: "Las unidades de PC no leen GD-ROM" }],
  [{ en: "GameCube", es: "GameCube" }, { en: "A Wii with the Homebrew Channel + CleanRip", es: "Un Wii con Homebrew Channel + CleanRip" }, { en: "Writes to SD/USB; the inbox converts it to RVZ", es: "Escribe a SD/USB; la bandeja lo convierte a RVZ" }],
];
function drawCollection() {
  document.getElementById("dumpers").innerHTML = `<tr><th>${t({ en: "Console", es: "Consola" })}</th><th>${t({ en: "Dump with", es: "Copiar con" })}</th><th>${t({ en: "Notes", es: "Notas" })}</th></tr>` +
    DUMP.map(([c, h, n]) => `<tr><td>${esc(t(c))}</td><td>${esc(t(h))}</td><td class="small mut">${esc(t(n))}</td></tr>`).join("");
  document.getElementById("ingestBtn").textContent = t({ en: "Ingest the inbox", es: "Procesar la bandeja" });
  document.getElementById("exportBtn").textContent = t({ en: "Write the Telesia export", es: "Escribir la exportación para Telesia" });
  if (!G) return;
  const tools = G.tools || {}, missing = Object.entries(tools).filter(([, v]) => !v).map(([k]) => k);
  document.getElementById("inboxInfo").innerHTML = `<b>~/Games/inbox</b>: ${G.inbox.files} ${t({ en: "files", es: "archivos" })} (${human(G.inbox.bytes)})` +
    (missing.length ? `<div class="small warn">${t({ en: "Not installed yet: ", es: "Aún no instalado: " })}${missing.map((m) => `<code>${esc(m)}</code>`).join(" ")} ${t({ en: "(discs are filed uncompressed until chdman / dolphin-tool exist)", es: "(los discos se archivan sin comprimir hasta tener chdman / dolphin-tool)" })}</div>` : `<div class="small ok">${t({ en: "Dump and conversion tools installed", es: "Herramientas de copia y conversión instaladas" })}</div>`);
  const T = G.telesia;
  document.getElementById("telesiaInfo").innerHTML = `<b>${T.titles}</b> ${t({ en: "titles exported", es: "títulos exportados" })} · ${T.played} ${t({ en: "with play time", es: "con tiempo de juego" })}` +
    (T.written ? `<div class="small mut">${esc(T.file)} · ${new Date(T.written * 1000).toLocaleString(Portal.lang === "es" ? "es-MX" : "en-US")}</div>` : "");
}
async function post(path, btn, out) {
  const tk = document.querySelector('meta[name="kit-token"]')?.content, o = document.getElementById(out);
  btn.disabled = true; o && (o.classList.remove("hidden"), (o.textContent = t({ en: "Working…", es: "Trabajando…" })));
  try { const j = await (await fetch(path, { method: "POST", headers: { "X-Token": tk, "Content-Type": "application/json" }, body: "{}" })).json(); if (o) o.textContent = j.lines.join("\n"); }
  catch (e) { if (o) o.textContent = t({ en: "Couldn't run: open the kit with Super+Shift+H.", es: "No se pudo ejecutar: abre el kit con Super+Shift+H." }); }
  btn.disabled = false; load();
}
document.getElementById("ingestBtn").addEventListener("click", (e) => post("/api/games/ingest", e.target, "ingestOut"));
document.getElementById("exportBtn").addEventListener("click", (e) => post("/api/games/export-telesia", e.target, null));
async function load() {
  if (!Portal.live) { const o = document.getElementById("offline"); o.classList.remove("hidden"); o.textContent = t({ en: "Open this page with Super+Shift+H to see your library and controller.", es: "Abre esta página con Super+Shift+H para ver tu biblioteca y control." }); return; }
  try { G = await (await fetch("/api/games", { cache: "no-store" })).json(); } catch (e) { G = null; }
  draw(); drawCollection();
}
document.getElementById("scanBtn").addEventListener("click", async () => {
  const msg = document.getElementById("scanMsg"), tk = document.querySelector('meta[name="kit-token"]')?.content;
  msg.textContent = t({ en: "Updating…", es: "Actualizando…" });
  try {
    const r = await fetch("/api/games/scan", { method: "POST", headers: { "X-Token": tk, "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json(); msg.textContent = j.message; load();
  } catch (e) { msg.textContent = t({ en: "Couldn't update: open the kit with Super+Shift+H.", es: "No se pudo actualizar: abre el kit con Super+Shift+H." }); }
});
Portal.start(() => { draw(); drawCollection(); });
load(); setInterval(() => { if (!document.hidden) load(); }, 5000);
</script></body></html>
