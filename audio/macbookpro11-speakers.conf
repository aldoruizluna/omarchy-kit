# MacBook Pro 15" Retina (MacBookPro11,3) internal speakers — generated by design_eq.py; edit that, not this.
#
# Unmeasured voicing for small laptop drivers (see design_eq.py for the reasoning behind each filter).
# Installed in Omarchy's speaker-tuning layout so `omarchy audio tuning status|off` manage it and Omarchy's
# volume keys resolve through it to the real speakers. No limiter (lsp-plugins-lv2 is not installed):
# instead the pre-gain (-3.58 dB) keeps the whole chain at or below -0.5 dB at every frequency,
# so it cannot clip.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "MacBook Speakers"
      media.name       = "MacBook Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = pre_l label = mixer control = { "Gain 1" = 0.6626 } }
          { type = builtin name = s0_l label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.707 } }
          { type = builtin name = s1_l label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.707 } }
          { type = builtin name = s2_l label = bq_peaking control = { "Freq" = 160.0 "Q" = 0.9 "Gain" = 4.0 } }
          { type = builtin name = s3_l label = bq_peaking control = { "Freq" = 380.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = s4_l label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.2 "Gain" = -1.5 } }
          { type = builtin name = s5_l label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 2.0 } }
          { type = builtin name = pre_r label = mixer control = { "Gain 1" = 0.6626 } }
          { type = builtin name = s0_r label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.707 } }
          { type = builtin name = s1_r label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.707 } }
          { type = builtin name = s2_r label = bq_peaking control = { "Freq" = 160.0 "Q" = 0.9 "Gain" = 4.0 } }
          { type = builtin name = s3_r label = bq_peaking control = { "Freq" = 380.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = s4_r label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.2 "Gain" = -1.5 } }
          { type = builtin name = s5_r label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 2.0 } }
        ]
        links = [
          { output = "pre_l:Out" input = "s0_l:In" }
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "pre_r:Out" input = "s0_r:In" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
        ]
        inputs  = [ "pre_l:In 1" "pre_r:In 1" ]
        outputs = [ "s5_l:Out" "s5_r:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "alsa_output.pci-0000_00_1b.0.analog-stereo"
        # Same guards as Omarchy's own tunings: never get dragged to another output, and wait for the
        # speakers rather than silently processing whatever the default device happens to be.
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }
]
