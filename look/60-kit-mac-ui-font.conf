<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Omarchy Kit (icons/): the Omarchy shell draws the bar, menus and panels in the system "monospace" font. For the shell and the Dock
       (both run as "quickshell") only, use the system UI font instead (Adwaita Sans, derived from Inter, the closest free relative of
       macOS's San Francisco). Terminals, editors and every other program keep their monospace font. Remove this file to undo. -->
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="genericfamily"><const>monospace</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Adwaita Sans</string></edit>
  </match>
</fontconfig>
