<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn Omarchy · Aprender</title>
<link rel="stylesheet" href="portal.css">
<style>
.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;margin-top:18px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side h4{margin:12px 0 4px;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.93rem}
.side a:hover{background:var(--soft)}.side a[aria-current=true]{background:var(--soft);font-weight:700}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.step{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--mut)}
.step.watching .sn{border-color:var(--acc);color:var(--acc);animation:ring 1.6s infinite}
.step.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 50%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:none}}
.step .keys{margin:6px 0}
.step .st{font-size:.82rem;margin-top:4px}
.step.locked{opacity:.45}
.box{margin-top:8px}
.celebrate{display:none;text-align:center;padding:18px}
.celebrate.on{display:block;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.gest{display:inline-block;background:var(--soft);border-radius:99px;padding:1px 10px;font-weight:700;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.step.watching .sn,.celebrate.on{animation:none}}
</style>
<meta name="kit-token" content=""><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="kit.css"><script src="kit.js" defer></script></head>
<body><div class="wrap">
<header class="top"><span class="brand">Omarchy Kit</span><button id="bLang"></button></header>
<div id="top"></div>
<div class="layout">
  <nav class="side card" id="side" aria-label="lessons"></nav>
  <main>
    <div class="callout" id="liveNote"></div>
    <div class="card" id="lesson"></div>
    <div class="card celebrate" id="party"></div>
  </main>
</div>
</div>
<script>window.PORTAL=/*__PORTAL__*/{};window.TOKEN=/*__TOKEN__*/null;</script>
<script src="portal.js"></script><script src="portal-nav.js"></script>
<script>
const D = Portal.data, t = Portal.t, esc = Portal.esc;
const LESSONS = D.levels.flatMap((lv) => lv.lessons.map((l) => ({ ...l, level: lv })));
let cur = null, stepIdx = 0, baseline = null, armed = false, poll = 0;
const stepKey = (l, i) => `step:${l.id}:${i}`;
const lessonDone = (l) => Portal.progress.get(l.id) === "done";
const stepDone = (l, i) => Portal.progress.get(stepKey(l, i)) === 1;

// ---- verification: each check returns true when the step's goal is met, compared with the state when the step began.
// Steps are edge-triggered: the goal must be false at some point after the step starts before it can pass, so a
// state you were already in (e.g. already on space 1) doesn't tick the step by itself.
const count = (s, re) => s.clients.filter((c) => !re || new RegExp(re, "i").test(c.class || "")).length;
const CHECKS = {
  newWindow: (s, b, st) => count(s, st.cls) > count(b, st.cls),
  closeWindow: (s, b) => s.clients.length < b.clients.length,
  wsIs: (s, b, st) => s.ws === st.ws,
  wsChange: (s, b) => s.ws !== b.ws,
  moved: (s, b) => s.clients.some((c) => { const o = b.clients.find((x) => x.addr === c.addr); return o && o.ws !== c.ws && c.ws > 0; }),
  floating: (s, b, st) => !!s.active.floating === st.v,
  fullscreen: (s, b, st) => (s.active.fullscreen > 0) === st.v,
  special: (s, b, st) => (s.special !== "") === st.v,
  toSpecial: (s, b) => s.clients.filter((c) => c.ws < 0).length > b.clients.filter((c) => c.ws < 0).length,
  focusChange: (s, b) => s.active.addr && s.active.addr !== b.active.addr && s.ws === b.ws,
  grouped: (s) => s.active.grouped > 1,
  themeChanged: (s, b) => s.theme && s.theme !== b.theme,
  volumeChanged: (s, b) => s.volume !== b.volume,
  newShot: (s, b) => (s.shot || 0) > (b.shot || 0),
};
const AUTO = (st) => st.check in CHECKS;

function select(id) {
  cur = LESSONS.find((l) => l.id === id) || LESSONS.find((l) => !lessonDone(l)) || LESSONS[0];
  stepIdx = cur.steps.findIndex((_, i) => !stepDone(cur, i)); if (stepIdx < 0) stepIdx = cur.steps.length;
  if (location.hash.slice(1) !== cur.id) history.replaceState(null, "", "#" + cur.id);
  document.getElementById("party").classList.remove("on");
  beginStep(); render();
}
async function beginStep() {
  baseline = await Portal.api.state(); armed = false;
  clearInterval(poll);
  const st = cur && cur.steps[stepIdx];
  if (st && AUTO(st) && baseline) poll = setInterval(tick, 700);
}
async function tick() {
  const st = cur.steps[stepIdx]; if (!st) return clearInterval(poll);
  const s = await Portal.api.state(); if (!s) return;
  const met = CHECKS[st.check](s, baseline, st);
  if (!met) { armed = true; return; }
  if (armed || st.check === "newWindow" || st.check === "closeWindow" || st.check === "moved" || st.check === "toSpecial" || st.check === "themeChanged" || st.check === "volumeChanged" || st.check === "newShot" || st.check === "focusChange" || st.check === "wsChange") complete();
}
function complete() {
  clearInterval(poll);
  Portal.progress.set(stepKey(cur, stepIdx), 1);
  stepIdx++;
  if (stepIdx >= cur.steps.length) { Portal.progress.set(cur.id, "done"); render(); celebrate(); return; }
  render(); beginStep();
}
function celebrate() {
  const i = LESSONS.indexOf(cur), next = LESSONS.slice(i + 1).find((l) => !lessonDone(l)) || LESSONS[i + 1];
  const p = document.getElementById("party"); p.classList.add("on");
  if (window.Kit) Kit.confetti();
  p.innerHTML = `<div style="font-size:2rem">🎉</div><h3>${t({ en: "Lesson complete!", es: "¡Lección completada!" })}</h3>` +
    (next ? `<button class="primary" onclick="select('${next.id}')">${t({ en: "Next: ", es: "Siguiente: " })}${esc(t(next))}</button>` : `<p>${t({ en: "You finished the whole course. You're an Omarchy user now.", es: "Terminaste el curso completo. Ya eres usuario de Omarchy." })}</p>`);
}
function stepHTML(st, i) {
  const state = i < stepIdx ? "done" : i === stepIdx ? (AUTO(st) && Portal.live ? "watching" : "current") : "locked";
  const keys = st.k ? Portal.bindHTML(st.k) : st.keys ? st.keys.split(" / ").map(Portal.kbd).join(" / ") : "";
  const status = state === "done" ? `<span class="ok">✓ ${t({ en: "done", es: "hecho" })}</span>`
    : state === "watching" ? `<span class="info">${t({ en: "Watching your desktop… do it now", es: "Observando tu escritorio… hazlo ahora" })}</span>`
    : state === "current" ? "" : "";
  return `<div class="step ${state}" data-i="${i}"><div class="sn">${state === "done" ? "✓" : i + 1}</div><div>
    <div>${esc(t(st))}</div>
    ${keys || st.gesture || st.menu || st.cmd ? `<div class="keys row">${keys}${st.gesture ? `<span class="gest">✋ ${esc(st.gesture)}</span>` : ""}${st.menu ? Portal.menuBtn(st.menu) : ""}${st.cmd ? `<code>${esc(st.cmd)}</code>${Portal.copyBtn(st.cmd)}` : ""}</div>` : ""}
    ${st.box && i === stepIdx ? `<input type="text" class="box" id="box" autocomplete="off" placeholder="${t({ en: "Type here…", es: "Escribe aquí…" })}">` : ""}
    <div class="st">${status}${i === stepIdx ? ` <button class="copy" onclick="complete()">${AUTO(st) || st.check === "typed" ? t({ en: "Skip, I did it", es: "Saltar, ya lo hice" }) : t({ en: "Done ✓", es: "Hecho ✓" })}</button>` : ""}</div>
  </div></div>`;
}
function render() {
  document.getElementById("side").innerHTML = D.levels.map((lv) => `<h4>${esc(t(lv))}</h4>` + lv.lessons.map((l) =>
    `<a href="#${l.id}" aria-current="${cur && cur.id === l.id}"><span class="tick ${lessonDone(l) ? "on" : ""}">${lessonDone(l) ? "✓" : ""}</span>${esc(t(l))}</a>`).join("")).join("") +
    `<p style="margin-top:14px"><button class="copy" id="resetBtn">${t({ en: "Reset progress", es: "Reiniciar progreso" })}</button></p>`;
  document.getElementById("liveNote").innerHTML = Portal.live
    ? `<span class="live-dot"></span>${t({ en: "Live mode: steps tick themselves when you do them on your real desktop.", es: "Modo en vivo: los pasos se marcan solos cuando los haces en tu escritorio real." })}`
    : `<span class="live-dot off"></span>${t({ en: "Opened as a file, so live checking is off. Open it with Super+Shift+H to have steps verify themselves.", es: "Abierta como archivo: la verificación en vivo está apagada. Ábrela con Super+Shift+H para que los pasos se verifiquen solos." })}`;
  if (!cur) return;
  const done = cur.steps.filter((_, i) => i < stepIdx).length;
  document.getElementById("lesson").innerHTML = `<div class="small mut">${esc(t(cur.level))}</div><h1 style="margin-top:4px">${esc(t(cur))}</h1>
    <p class="lead">${esc(t(cur.why))}</p><div class="progress" style="margin:10px 0 4px"><i style="width:${(100 * done) / cur.steps.length}%"></i></div>
    <div>${cur.steps.map(stepHTML).join("")}</div>`;
  const box = document.getElementById("box");
  if (box) { const st = cur.steps[stepIdx]; box.focus(); box.addEventListener("input", () => { if (new RegExp(st.re, "u").test(box.value)) complete(); }); }
}
document.addEventListener("click", (e) => { if (e.target.id === "resetBtn") { Portal.progress.reset(); select(LESSONS[0].id); } });
addEventListener("hashchange", () => { if (!cur || location.hash.slice(1) !== cur.id) select(location.hash.slice(1)); });
Portal.start(render);
select(location.hash.slice(1));
</script></body></html>
