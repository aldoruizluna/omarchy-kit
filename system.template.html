<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System · Omarchy Kit</title>
<link rel="stylesheet" href="portal.css">
<style>
.lead{margin-bottom:6px}
.strip{display:grid;grid-template-columns:minmax(230px,1.1fr) 2fr;gap:12px;margin-top:16px}
@media(max-width:820px){.strip{grid-template-columns:1fr}}
.hero-num{font:700 clamp(3rem,7vw,4.2rem)/1 system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 4px}
.hero-num small{font-size:.4em;font-weight:600;color:var(--mut);margin-left:4px}
.state{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.9rem}
.state svg{width:16px;height:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.fact .k{font-size:.76rem;color:var(--mut)}
.fact .v{font-weight:700;font-size:1.02rem;margin-top:1px}
.fact .v small{font-weight:500;color:var(--mut);font-size:.78rem}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:26px 0 10px}
.ctrl h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;background:var(--card)}
.seg button+button{border-left:1px solid var(--line)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.chart h3{margin:0;font-size:.95rem}
.chart .sub{font-size:.8rem;color:var(--mut);margin-bottom:6px;display:flex;gap:12px;flex-wrap:wrap}
.chart .sub .key{display:inline-flex;align-items:center;gap:5px}
.chart .sub .key i{width:14px;height:2px;border-radius:2px;display:inline-block}
.plot{position:relative;height:150px}
.plot svg{display:block;width:100%;height:100%;overflow:visible}
.plot text{font:11px system-ui,sans-serif;fill:var(--mut);font-variant-numeric:tabular-nums}
.plot .end{font-weight:700;fill:var(--fg);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:.8rem;
  box-shadow:0 10px 26px -14px rgba(0,0,0,.6);white-space:nowrap;z-index:2;transform:translate(-50%,-100%);top:-6px}
.tip b{font-size:.95rem}.tip .row{gap:6px}.tip i{width:12px;height:2px;display:inline-block;border-radius:2px}
.mm{font-size:.78rem;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.top td,.top th{padding:6px 8px}
.top td:nth-child(n+2),.top th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--kbd);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc-fill,var(--acc))}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--acc);font-weight:600}
details.tbl td,details.tbl th{font-variant-numeric:tabular-nums;padding:5px 8px;font-size:.85rem}
.wrapx{overflow-x:auto}
</style>
<meta name="kit-token" content=""><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="kit.css"><script src="kit.js" defer></script></head>
<body><div class="wrap">
<header class="top"><span class="brand">Omarchy Kit</span><button id="bLang"></button></header>
<div id="top"></div>
<h1 data-en="System, live" data-es="Sistema, en vivo"></h1>
<p class="lead" data-en="What your MacBook is doing right now: temperature, fans, CPU, memory, network and battery, sampled every 2 seconds and kept for 30 minutes." data-es="Lo que tu MacBook está haciendo ahora mismo: temperatura, ventiladores, CPU, memoria, red y batería, medidos cada 2 segundos y guardados 30 minutos."></p>
<div class="callout warn hidden" id="offline"></div>

<div class="strip">
  <div class="card">
    <div class="small mut"><span class="live-dot" id="dot"></span><span data-en="CPU temperature" data-es="Temperatura del CPU"></span></div>
    <div class="hero-num" id="heroT">—</div>
    <div id="heroState"></div>
    <p class="small mut" id="heroNote" style="margin-top:8px"></p>
  </div>
  <div class="card"><div class="facts" id="facts"></div></div>
</div>

<div class="ctrl">
  <h2 data-en="History" data-es="Historial"></h2>
  <div class="seg" role="group" aria-label="range" id="range">
    <button data-min="5">5 min</button><button data-min="15">15 min</button><button data-min="30">30 min</button>
  </div>
</div>
<div class="charts" id="charts"></div>
<details class="tbl"><summary data-en="Show the numbers as a table" data-es="Ver los números como tabla"></summary><div class="wrapx" id="table"></div></details>

<div class="cols">
  <div class="card">
    <h3 style="margin-top:0" data-en="Busiest apps right now" data-es="Apps más ocupadas ahora"></h3>
    <table class="top" id="topTbl"></table>
    <p class="small mut" data-en="CPU % is per core, so one app can go above 100%. Your i7 has 8 threads (800% total)." data-es="El % de CPU es por núcleo, así que una app puede pasar de 100%. Tu i7 tiene 8 hilos (800% en total)."></p>
  </div>
  <div class="card">
    <h3 style="margin-top:0" data-en="Reading the graphs" data-es="Cómo leer las gráficas"></h3>
    <p class="small" data-en="<b>Temperature</b> under 70 °C is cool; 70–85 °C is warm (normal while video plays or apps install); above 85 °C means something is working hard. Your MacBook throttles itself near 100 °C." data-es="<b>Temperatura</b>: menos de 70 °C es fresco; 70–85 °C es tibio (normal con video o instalando apps); más de 85 °C significa que algo trabaja duro. Tu MacBook se frena sola cerca de 100 °C."></p>
    <p class="small" data-en="<b>Fans</b> idle around 2,000 RPM and reach about 6,000 at full speed. Before the GPU fix they sat near 5,900 all the time." data-es="<b>Ventiladores</b>: en reposo giran a unas 2,000 RPM y llegan a unas 6,000 al máximo. Antes del arreglo de la GPU estaban casi siempre cerca de 5,900."></p>
    <p class="small" data-en="<b>NVIDIA GPU</b> “off (D3hot)” is what you want: the Intel GPU drives the screen and the hot NVIDIA chip sleeps." data-es="<b>GPU NVIDIA</b> “apagada (D3hot)” es lo que quieres: la GPU Intel maneja la pantalla y el chip NVIDIA, que calienta, duerme."></p>
  </div>
</div>
</div>
<script>window.PORTAL=/*__PORTAL__*/{};window.TOKEN=/*__TOKEN__*/null;</script>
<script src="portal.js"></script><script src="portal-nav.js"></script>
<script>
const t = Portal.t, esc = Portal.esc;
let samples = [], snap = null, last = 0, mins = 15;
try { mins = +localStorage.getItem("sys-range") || 15; } catch (e) {}

// One chart per measure (small multiples): one y-axis each, never two scales on one plot.
const CHARTS = [
  { id: "temp", en: "CPU temperature", es: "Temperatura del CPU", unit: "°C", min: 40, max: 100, s: [["temp", "--acc-fill"]], fmt: (v) => v.toFixed(0) + " °C" },
  { id: "fan", en: "Fan speed", es: "Velocidad del ventilador", unit: "RPM", min: 1500, max: 6500, s: [["fan", "--acc-fill"]], fmt: (v) => Math.round(v).toLocaleString() + " RPM" },
  { id: "cpu", en: "CPU load", es: "Carga del CPU", unit: "%", min: 0, max: 100, s: [["cpu", "--acc-fill"]], fmt: (v) => v.toFixed(0) + "%" },
  { id: "mem", en: "Memory in use", es: "Memoria en uso", unit: "%", min: 0, max: 100, s: [["mem", "--acc-fill"]], fmt: (v) => v.toFixed(0) + "%" },
  { id: "net", en: "Network", es: "Red", unit: "/s", min: 0, max: null, s: [["rx", "--acc-fill", { en: "download", es: "bajada" }], ["tx", "--mut", { en: "upload", es: "subida" }]], fmt: (v) => bytes(v) + "/s" },
  { id: "bat", en: "Battery", es: "Batería", unit: "%", min: 0, max: 100, s: [["bat", "--acc-fill"]], fmt: (v) => v.toFixed(0) + "%" },
];
function bytes(v) { return v >= 1e6 ? (v / 1e6).toFixed(1) + " MB" : v >= 1e3 ? (v / 1e3).toFixed(0) + " KB" : Math.round(v) + " B"; }
const css = (v) => { const cs = getComputedStyle(document.documentElement); return cs.getPropertyValue(v).trim() || (v === "--acc-fill" && cs.getPropertyValue("--acc").trim()) || "#888"; };
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const ago = (s) => { const m = Math.round(s / 60); return s < 60 ? t({ en: "now", es: "ahora" }) : "−" + m + " min"; };
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString(Portal.lang === "es" ? "es-MX" : "en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" });

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

function drawChart(c, card) {
  const plot = card.querySelector(".plot"), W = plot.clientWidth, H = plot.clientHeight;
  if (!W) return;
  const now = samples.length ? samples[samples.length - 1].t : Date.now() / 1000, t0 = now - mins * 60;
  const data = samples.filter((s) => s.t >= t0);
  const L = 44, R = 56, T = 8, B = 20, w = W - L - R, h = H - T - B;
  let max = c.max;
  if (max == null) max = niceMax(Math.max(1, ...data.flatMap((s) => c.s.map(([k]) => s[k] || 0))) * 1.1);
  const lo = c.min, x = (ts) => L + ((ts - t0) / (mins * 60)) * w, y = (v) => T + h - ((Math.min(Math.max(v, lo), max) - lo) / (max - lo)) * h;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t(c) });
  const grid = css("--line");
  for (let i = 0; i <= 2; i++) {
    const v = lo + ((max - lo) * i) / 2, yy = Math.round(y(v)) + 0.5;
    svg.append(el("line", { x1: L, x2: L + w, y1: yy, y2: yy, stroke: grid, "stroke-width": 1 }));
    const tx = el("text", { x: L - 6, y: yy + 4, "text-anchor": "end" }); tx.textContent = c.id === "net" ? bytes(v) : Math.round(v).toLocaleString(); svg.append(tx);
  }
  [[t0, ago(mins * 60), "start"], [now, ago(0), "end"]].forEach(([ts, s, a]) => { const tx = el("text", { x: x(ts), y: H - 4, "text-anchor": a }); tx.textContent = s; svg.append(tx); });
  const ends = [];
  c.s.forEach(([k, col], si) => {
    const pts = data.filter((s) => s[k] != null).map((s) => [x(s.t), y(s[k])]);
    if (pts.length < 2) return;
    const color = css(col), d = "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L");
    if (si === 0) svg.append(el("path", { d: d + `L${pts[pts.length - 1][0]},${T + h}L${pts[0][0]},${T + h}Z`, fill: color, "fill-opacity": 0.1 }));
    svg.append(el("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-opacity": si ? 0.75 : 1 }));
    const p = pts[pts.length - 1];
    svg.append(el("circle", { cx: p[0], cy: p[1], r: 4, fill: color, stroke: css("--card"), "stroke-width": 2 }));
    ends.push([p[1], c.fmt(data[data.length - 1][k] ?? 0)]);
  });
  // value at the line end; two labels that would collide are left to the legend + tooltip
  if (ends.length === 1 || (ends.length === 2 && Math.abs(ends[0][0] - ends[1][0]) > 14))
    ends.forEach(([yy, s]) => { const tx = el("text", { x: L + w + 8, y: yy + 4, class: "end" }); tx.textContent = s.replace(" RPM", "").replace("/s", ""); svg.append(tx); });
  const cross = el("line", { y1: T, y2: T + h, stroke: css("--mut"), "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  plot.replaceChildren(svg);
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; plot.append(tip);
  const hit = el("rect", { x: L, y: 0, width: w, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  const show = (px) => {
    if (!data.length) return;
    let best = data[0]; for (const s of data) if (Math.abs(x(s.t) - px) < Math.abs(x(best.t) - px)) best = s;
    const bx = x(best.t); cross.setAttribute("x1", bx); cross.setAttribute("x2", bx); cross.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = Math.min(Math.max(bx, 70), W - 70) + "px";
    tip.replaceChildren();
    c.s.forEach(([k, col, name]) => {
      const r = document.createElement("div"); r.className = "row";
      if (c.s.length > 1) { const i = document.createElement("i"); i.style.background = css(col); r.append(i); }
      const b = document.createElement("b"); b.textContent = best[k] == null ? "—" : c.fmt(best[k]); r.append(b);
      if (name) { const n = document.createElement("span"); n.className = "mut"; n.textContent = t(name); r.append(n); }
      tip.append(r);
    });
    const tm = document.createElement("div"); tm.className = "mut small"; tm.textContent = clock(best.t); tip.append(tm);
  };
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", (e) => show(e.offsetX * (W / svg.clientWidth)));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => show(L + w)); hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const cur = +cross.getAttribute("x1") || L + w; show(cur + (e.key === "ArrowLeft" ? -w / 30 : w / 30)); e.preventDefault(); } });
  const vals = data.map((s) => s[c.s[0][0]]).filter((v) => v != null);
  card.querySelector(".mm").textContent = vals.length ? `min ${c.fmt(Math.min(...vals))} · ${t({ en: "avg", es: "prom" })} ${c.fmt(vals.reduce((a, b) => a + b, 0) / vals.length)} · max ${c.fmt(Math.max(...vals))}` : "";
}

function buildCharts() {
  document.getElementById("charts").innerHTML = CHARTS.map((c) => `<div class="card chart" data-id="${c.id}"><h3>${esc(t(c))}</h3>
    <div class="sub">${c.s.length > 1 ? c.s.map(([k, col, n]) => `<span class="key"><i style="background:var(${col})"></i>${esc(t(n))}</span>`).join("") : `<span>${esc(c.unit)}</span>`}</div>
    <div class="plot"></div><div class="mm"></div></div>`).join("");
}
function drawAll() {
  CHARTS.forEach((c) => drawChart(c, document.querySelector(`.chart[data-id="${c.id}"]`)));
  document.querySelectorAll("#range button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.min === mins));
  drawTable();
}
function drawTable() {
  const rows = samples.slice(-15).reverse();
  document.getElementById("table").innerHTML = `<table><tr><th>${t({ en: "Time", es: "Hora" })}</th>${CHARTS.flatMap((c) => c.s.map(([k, , n]) => `<th>${esc(t(c))}${n ? " (" + esc(t(n)) + ")" : ""}</th>`)).join("")}</tr>` +
    rows.map((s) => `<tr><td>${clock(s.t)}</td>${CHARTS.flatMap((c) => c.s.map(([k]) => `<td>${s[k] == null ? "—" : esc(c.fmt(s[k]))}</td>`)).join("")}</tr>`).join("") + "</table>";
}

const ICON = { ok: "M5 12l4 4 10-10", warn: "M12 4 2 20h20zM12 10v4M12 17h.01", bad: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v5M12 16h.01" };
const stateHTML = (cls, label) => `<span class="state ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[cls]}"/></svg>${esc(label)}</span>`;
function drawHero() {
  const s = samples[samples.length - 1]; if (!s || !snap) return;
  document.getElementById("heroT").innerHTML = `${Math.round(s.temp)}<small>°C</small>`;
  const st = s.temp < 70 ? ["ok", { en: "Cool", es: "Fresco" }] : s.temp < 86 ? ["warn", { en: "Warm", es: "Tibio" }] : ["bad", { en: "Hot", es: "Caliente" }];
  document.getElementById("heroState").innerHTML = stateHTML(st[0], t(st[1]));
  document.getElementById("heroNote").textContent = t({ en: `Fan ${s.fan?.toLocaleString()} RPM · CPU ${Math.round(s.cpu ?? 0)}%`, es: `Ventilador ${s.fan?.toLocaleString()} RPM · CPU ${Math.round(s.cpu ?? 0)}%` });
  const up = snap.uptime, upS = up > 86400 ? Math.floor(up / 86400) + "d " + Math.floor((up % 86400) / 3600) + "h" : up > 3600 ? Math.floor(up / 3600) + "h " + Math.floor((up % 3600) / 60) + "m" : Math.floor(up / 60) + " min";
  const gpuOff = /^D3/.test(snap.nvidia);
  const F = [
    [{ en: "Screen driven by", es: "Pantalla controlada por" }, snap.panel === "intel" ? stateHTML("ok", "Intel") : snap.panel === "nvidia" ? stateHTML("warn", "NVIDIA") : "?"],
    [{ en: "NVIDIA GPU", es: "GPU NVIDIA" }, gpuOff ? stateHTML("ok", t({ en: "off", es: "apagada" })) + ` <small>${esc(snap.nvidia)}</small>` : stateHTML("warn", t({ en: "on", es: "encendida" })) + (snap.gpu_temp ? ` <small>${snap.gpu_temp} °C</small>` : "")],
    [{ en: "Battery", es: "Batería" }, `${Math.round(s.bat ?? 0)}% <small>${esc(snap.battery.ac ? t({ en: "plugged in", es: "conectada" }) : s.watts ? s.watts + " W" : "")}</small>`],
    [{ en: "Battery health", es: "Salud de batería" }, `${snap.battery.health}% <small>${esc(snap.battery.cycles)} ${t({ en: "cycles", es: "ciclos" })}</small>`],
    [{ en: "Memory", es: "Memoria" }, `${Math.round(s.mem)}% <small>${t({ en: "of", es: "de" })} ${Math.round(snap.mem_total / 1e9)} GB</small>`],
    [{ en: "Disk", es: "Disco" }, `${Math.round((100 * snap.disk.used) / snap.disk.total)}% <small>${Math.round(snap.disk.used / 1e9)} / ${Math.round(snap.disk.total / 1e9)} GB</small>`],
    [{ en: "Wi-Fi", es: "Wi-Fi" }, snap.wifi?.ssid ? `${esc(snap.wifi.ssid)} <small>${snap.wifi.ghz ? snap.wifi.ghz + " GHz" : ""}</small>` : t({ en: "not connected", es: "sin conexión" })],
    [{ en: "Power mode", es: "Modo de energía" }, esc(snap.profile || "—")],
    [{ en: "Up for", es: "Encendida hace" }, upS],
    [{ en: "Load (1/5/15 min)", es: "Carga (1/5/15 min)" }, `${snap.load.join(" · ")}`],
  ];
  document.getElementById("facts").innerHTML = F.map(([k, v]) => `<div class="fact"><div class="k">${esc(t(k))}</div><div class="v">${v}</div></div>`).join("");
}
async function poll() {
  if (!Portal.live) return offline();
  try {
    const r = await (await fetch("/api/live?since=" + last, { cache: "no-store" })).json();
    samples = samples.concat(r.samples).filter((s) => s.t > Date.now() / 1000 - 1900);
    if (r.samples.length) last = r.samples[r.samples.length - 1].t;
    snap = r.snap; document.getElementById("dot").classList.remove("off"); document.getElementById("offline").classList.add("hidden");
    drawHero(); drawAll();
  } catch (e) { offline(); }
}
function offline() {
  document.getElementById("dot").classList.add("off");
  const o = document.getElementById("offline"); o.classList.remove("hidden");
  o.textContent = t({ en: "Live readings need the local helper: open this page with Super+Shift+H.", es: "Las lecturas en vivo necesitan el ayudante local: abre esta página con Super+Shift+H." });
}
async function topApps() {
  if (!Portal.live || document.hidden) return;
  try {
    const rows = await (await fetch("/api/top", { cache: "no-store" })).json();
    const max = Math.max(100, ...rows.map((r) => r.cpu));
    document.getElementById("topTbl").innerHTML = `<tr><th>${t({ en: "App", es: "App" })}</th><th>CPU</th><th>${t({ en: "Memory", es: "Memoria" })}</th></tr>` +
      rows.map((r) => `<tr><td>${esc(r.name)}<div class="bar"><i style="width:${(100 * r.cpu) / max}%"></i></div></td><td>${r.cpu.toFixed(0)}%</td><td>${r.mb.toLocaleString()} MB</td></tr>`).join("");
  } catch (e) {}
}
document.getElementById("range").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; mins = +b.dataset.min; try { localStorage.setItem("sys-range", mins); } catch (x) {} drawAll(); });
document.addEventListener("kit:theme", () => setTimeout(drawAll, 150));
new ResizeObserver(() => drawAll()).observe(document.getElementById("charts"));
Portal.start(() => { buildCharts(); drawHero(); drawAll(); });
poll(); topApps();
setInterval(() => { if (!document.hidden) poll(); }, 2000);
setInterval(topApps, 5000);
</script></body></html>
