# Box art, screenshots and title screens downloaded by `kit-games art` (counted in the budget)
[art]
types = ["Named_Boxarts", "Named_Snaps", "Named_Titles"]
gb_reserved = 4

# BIOS needed per console (paths inside ~/Games/bios). "any" = one of these files is enough (they are regional
# versions of the same BIOS). Curated, because the core info files mark CD BIOSes as optional even though CD
# games can't boot without them.
[[bios]]
system = "PlayStation"
any = ["scph5501.bin", "scph5500.bin", "scph5502.bin"]
need = "required"
note = "One region is enough: 5501 USA, 5500 Japan, 5502 Europe"

[[bios]]
system = "Sega CD / Mega-CD"
any = ["bios_CD_U.bin", "bios_CD_E.bin", "bios_CD_J.bin"]
need = "required"
note = "One region is enough: U USA, E Europe, J Japan"

[[bios]]
system = "PC Engine CD / TurboGrafx-CD"
any = ["syscard3.pce"]
need = "required"
note = "System Card 3.0 runs almost every CD game"

[[bios]]
system = "Sega Saturn"
any = ["kronos/saturn_bios.bin"]
need = "recommended"
note = "Kronos can emulate the BIOS, but compatibility is better with the real one"

[[bios]]
system = "GameCube"
any = ["dolphin-emu/Sys/codehandler.bin"]
need = "required"
note = "Dolphin's open-source Sys folder (installed by Omarchy Kit), not a console BIOS"

[[bios]]
system = "Dreamcast"
any = ["dc/dc_boot.bin"]
need = "optional"
note = "Flycast emulates the BIOS; the real one adds the boot animation and a few fixes"

[[bios]]
system = "Arcade + Neo Geo (FBNeo)"
any = ["fbneo/neogeo.zip", "../roms/arcade/neogeo.zip"]
need = "required"
note = "Needed for Neo Geo games only; keep it next to them in roms/arcade"

[[bios]]
system = "Game Boy Advance"
any = ["gba_bios.bin"]
need = "optional"
note = "mGBA has its own; the real one adds the boot logo"

[[bios]]
system = "NES / Famicom"
any = ["disksys.rom"]
need = "optional"
note = "Only for Famicom Disk System games"
