# Retro library plan for the MacBook Pro 2014 (i7-4870HQ, Iris Pro 5200, 2880x1800).
#
# folder  ~/Games/roms/<folder>
# db      libretro database / thumbnail name (playlists and box art use it)
# core    RetroArch core that runs it best on this machine (benchmarked or chosen for accuracy + thermals)
# target  how many games the plan reserves room for ("top N")
# gb_each typical compressed size per game (zip / CHD / RVZ), used for the allocation
# tier    perfect | great | good | mixed: how well this machine runs it
#
# Budget: half the free disk when the library was set up (see `kit-games budget`). Cartridge consoles,
# PlayStation and Dreamcast get their full top 100; the CD add-ons, Saturn and GameCube get curated sets of
# the games that run well here, because together they would need ~190 GB on their own.

[[system]]
folder = "nes"
name = "NES / Famicom"
db = "Nintendo - Nintendo Entertainment System"
core = "mesen"
exts = ["nes", "fds", "unf", "zip", "7z"]
target = 100
gb_each = 0.0002
tier = "perfect"

